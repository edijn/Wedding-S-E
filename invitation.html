<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sophie &amp; Edi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cinzel:wght@400;500;700&family=Playfair+Display:wght@400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="attente" id="attente">…</div>

<section id="invitation" hidden>

  <div class="photo-cadre">
    <img class="photo" id="photo" alt="" fetchpriority="high" decoding="async">

    <div class="titre-photo">
      <h1 class="noms">Sophie<span class="et">&amp;</span>Edi</h1>
      <p class="sous-titre"><span id="save">Save the date</span></p>
    </div>

    <p class="accroche accroche-photo" id="accroche"></p>
  </div>

  <div class="corps">
    <div class="ceremonie" id="ceremonie"></div>

    <div class="bloc-rsvp">
      <button class="btn btn-large" id="ouvrir-rsvp"></button>
      <p class="note" id="note"></p>
    </div>
  </div>

</section>

<div class="voile" id="voile" hidden>
  <div class="tiroir" id="tiroir"></div>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";

  /* ═══════════════════════════════════════════════════════════════
     1. LE FOYER
     Déposé par index.html dans sessionStorage. Pas de code en
     mémoire → on renvoie à la saisie.
     ═══════════════════════════════════════════════════════════════ */

  var brut = sessionStorage.getItem("foyer");
  var code = sessionStorage.getItem("code");
  if (!brut || !code){ location.replace("index.html"); return; }

  var foyer   = JSON.parse(brut);
  var invites = foyer.invites || [];          // dans l'ordre du Sheet
  var seul    = !!foyer.seul || invites.length === 1;

  var p = new URLSearchParams(location.search);
  var lang = (p.get("lang") === "en" || p.get("lang") === "fr")
               ? p.get("lang")
               : (foyer.langue || LANGUE_DEFAUT);
  var T = TEXTES[lang] || TEXTES.fr;

  document.documentElement.lang = lang;
  document.title = T.titre_page;
  document.getElementById("attente").textContent = T.chargement;

  /* ═══════════════════════════════════════════════════════════════
     2. OUTILS
     ═══════════════════════════════════════════════════════════════ */

  /* Volontairement permissif : il s'agit d'attraper une faute de
     frappe, pas de juger de l'existence d'une boîte aux lettres. */
  var EMAIL = /^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/;

  function focaliser(sel){
    var n = tiroir.querySelector(sel);
    if (n) n.focus();
  }

  function echap(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* « Paul, Claire, Léa et Tom » — avec le bon connecteur. */
  function liste(noms){
    if (noms.length === 0) return "";
    if (noms.length === 1) return noms[0];
    var et = (lang === "en") ? " and " : " et ";
    return noms.slice(0, -1).join(", ") + et + noms[noms.length - 1];
  }

  var ICONES = {
    eglise: '<g transform="translate(0 .4)">'
      + '<path d="M12 2.2v3"/><path d="M10.4 3.5h3.2"/>'
      + '<path d="M12 5.4 8.2 9.3V21h7.6V9.3z"/>'
      + '<path d="M8.2 11.6 4 14.1V21h4.2"/><path d="M15.8 11.6 20 14.1V21h-4.2"/>'
      + '<path d="M10.3 21v-3.1a1.7 1.7 0 0 1 3.4 0V21"/>'
      + '<circle cx="12" cy="12.6" r="1"/></g>',

    fete: '<g transform="translate(.2 1.15)">'
      + '<path d="M12 3.6c.55 4.6 1.5 5.55 6.1 6.1-4.6.55-5.55 1.5-6.1 6.1-.55-4.6-1.5-5.55-6.1-6.1 4.6-.55 5.55-1.5 6.1-6.1Z"/>'
      + '<path d="M6.4 14.9c.2 1.5.5 1.8 2 2-1.5.2-1.8.5-2 2-.2-1.5-.5-1.8-2-2 1.5-.2 1.8-.5 2-2Z"/>'
      + '<path d="M17.7 16.1c.15 1.1.35 1.35 1.45 1.5-1.1.15-1.3.4-1.45 1.5-.15-1.1-.35-1.35-1.45-1.5 1.1-.15 1.3-.4 1.45-1.5Z"/></g>',

    tasse: '<g transform="translate(1 -.55)">'
      + '<path d="M3.9 9.3h12.2v5.4a4.6 4.6 0 0 1-4.6 4.6H8.5a4.6 4.6 0 0 1-4.6-4.6V9.3Z"/>'
      + '<path d="M16.1 10.7h1.5a2.4 2.4 0 0 1 0 4.8h-1.5"/>'
      + '<path d="M2.4 21.4h17.2"/>'
      + '<path d="M8 6.6c-1-1 .7-1.9-.3-2.9"/>'
      + '<path d="M12 6.6c-1-1 .7-1.9-.3-2.9"/></g>'
  };

  function svg(nom){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
         + ' stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"'
         + ' aria-hidden="true">' + (ICONES[nom] || ICONES.fete) + '</svg>';
  }

  function envoyer(charge){
    return fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(charge)
    }).then(function(r){ return r.json(); });
  }

  /* ═══════════════════════════════════════════════════════════════
     3. L'INVITATION
     ═══════════════════════════════════════════════════════════════ */

  var photo = document.getElementById("photo");
  photo.src = PHOTO;
  photo.alt = (lang === "en")
    ? "Sophie and Edi at the proposal, in the canyon at sunset"
    : "Sophie et Edi au moment de la demande, dans le canyon au coucher du soleil";

  document.getElementById("save").textContent = T.save;

  var prenoms = invites.map(function(i){ return i.prenom; });
  document.getElementById("accroche").innerHTML =
      "<strong>" + echap(liste(prenoms)) + "</strong>, "
    + echap(seul ? T.accroche_solo : T.accroche);

  document.getElementById("ceremonie").innerHTML =
    (PROGRAMME[lang] || PROGRAMME.fr).map(function(jour){
      var seule = jour.etapes.length === 1;
      return '<div class="jour">'
        + '<p class="ceremonie-date">' + echap(jour.date) + '</p>'
        + '<div class="etapes' + (seule ? ' etapes-seul' : '') + '">'
        + jour.etapes.map(function(e){
            return '<div class="etape">'
              + '<div class="etape-icone">' + svg(e.icone) + '</div>'
              + '<div>'
              + '<p class="etape-heure">'   + echap(e.heure) + '</p>'
              + '<p class="etape-quoi">'    + echap(e.quoi)  + '</p>'
              + '<p class="etape-lieu">'    + echap(e.lieu)  + '</p>'
              + '<p class="etape-adresse">' + echap(e.ville) + '</p>'
              + '</div></div>';
          }).join("")
        + '</div></div>';
    }).join("");

  var limite = (DATE_LIMITE && DATE_LIMITE[lang]) || DATE_LIMITE.fr || "";
  document.getElementById("note").innerHTML =
    echap(T.note) + " <strong>" + echap(limite) + "</strong>.";

  var boutonPrincipal = document.getElementById("ouvrir-rsvp");
  majBouton();

  function majBouton(){
    var deja = !!foyer.reponse;
    boutonPrincipal.textContent = deja
      ? (seul ? T.bouton_modif_solo : T.bouton_modif)
      : T.bouton;
  }

  document.getElementById("attente").hidden = true;
  document.getElementById("invitation").hidden = false;

  /* ═══════════════════════════════════════════════════════════════
     4. LE PANNEAU RSVP

     Foyer d'une seule personne : deux réponses seulement, au
     singulier, et pas de liste de prénoms à cocher — il n'y a
     personne à départager.
     Foyer de plusieurs : trois réponses, et le choix mariage /
     brunch se pose UNE fois pour tout le foyer, directement sous
     l'option retenue (v10).
     ═══════════════════════════════════════════════════════════════ */

  var tiroir = document.getElementById("tiroir");
  var voile  = document.getElementById("voile");
  var etat = {
    reponse: null,                 // "tous" | "partiel" | "aucun"
    presents: prenoms.slice(),
    brunch: true,
    mot: "",
    adresse: "",
    email: ""
  };

  /* Réponse déjà envoyée : on rouvre dessus plutôt que sur du vide. */
  if (foyer.reponse){
    var r = foyer.reponse;
    etat.presents = r.presents || [];
    etat.brunch   = !!r.brunch;
    etat.mot      = r.mot || "";
    etat.adresse  = r.adresse || "";
    etat.email    = r.email || "";
    etat.reponse  = !etat.presents.length ? "aucun"
                  : (etat.presents.length === invites.length ? "tous" : "partiel");
  }

  boutonPrincipal.addEventListener("click", ouvrirTiroir);

  function ouvrirTiroir(){
    voile.hidden = false;
    document.body.style.overflow = "hidden";
    dessinerChoix();
  }

  function fermerTiroir(){
    voile.hidden = true;
    document.body.style.overflow = "";
  }

  function dessinerChoix(){
    var h = '<div class="choix">';

    if (seul){
      h += radio("oui", T.rep_oui_solo, etat.reponse === "tous")
         + pastillesFoyer(etat.reponse === "tous")
         + radio("aucun", T.rep_non_solo, etat.reponse === "aucun");
    } else {
      /* Les pastilles mariage / brunch se posent juste SOUS l'option
         retenue, comme pour un foyer d'une seule personne. Deux
         options ne peuvent pas être cochées en même temps : il n'y a
         donc jamais deux jeux de pastilles, ni deux groupes de
         boutons radio portant le même name="venue".
         v11 : les prénoms suivent immédiatement les pastilles, dans
         la liste elle-même. Le foyer lit donc de haut en bas : je
         viens en partie → mariage ou mariage + brunch → qui vient.
         Ils restent au-dessus de « nous ne pourrons pas venir ». */
      h += radio("tous", T.rep_tous, etat.reponse === "tous")
         + pastillesFoyer(etat.reponse === "tous")
         + radio("partiel", T.rep_partiel, etat.reponse === "partiel")
         + pastillesFoyer(etat.reponse === "partiel")
         + grillePrenoms(etat.reponse === "partiel")
         + radio("aucun", T.rep_aucun, etat.reponse === "aucun");
    }
    h += '</div>';

    /* Coordonnées : seulement si le foyer vient, en tout ou en
       partie. Elles sont posées APRÈS la liste des réponses et non
       dedans : glissées entre « une partie d'entre nous » et « nous
       ne pourrons pas venir », deux champs de saisie couperaient la
       liste en deux et donneraient à lire un formulaire au milieu
       d'un choix. Ici l'ordre est celui de la décision — je viens,
       voici où me joindre, un mot, j'envoie. */
    h += coordonnees(etat.reponse === "tous" || etat.reponse === "partiel");

    h += '<div class="champ">'
      +  '<label for="mot">' + echap(T.mot_label) + '</label>'
      +  '<textarea id="mot" placeholder="' + echap(T.mot_exemple) + '">'
      +  echap(etat.mot) + '</textarea></div>'
      +  '<p class="erreur" id="err-rsvp" role="status"></p>'
      +  '<div class="pied">'
      +  '<button class="btn" id="env">'
      +  echap(seul ? T.envoyer_solo : T.envoyer) + '</button>'
      +  '<button class="btn btn-fantome" id="ann">' + echap(T.annuler) + '</button>'
      +  '</div>';

    tiroir.innerHTML = h;
    brancherChoix();
  }

  function radio(valeur, libelle, actif){
    return '<label><input type="radio" name="rep" value="' + valeur + '"'
         + (actif ? " checked" : "") + '>'
         + '<span class="choix-txt">' + echap(libelle) + '</span></label>';
  }

  /* Le choix mariage / mariage + brunch, une seule fois par foyer. */
  function pastillesFoyer(visible){
    if (!visible) return "";
    return '<div class="venue-foyer"><div class="venue">'
      + '<label><input type="radio" name="venue" value="mariage"'
      + (etat.brunch ? "" : " checked") + '>'
      + '<span>' + echap(T.venue_mariage) + '</span></label>'
      + '<label><input type="radio" name="venue" value="brunch"'
      + (etat.brunch ? " checked" : "") + '>'
      + '<span>' + echap(T.venue_brunch) + '</span></label>'
      + '</div></div>';
  }

  /* L'adresse postale et l'e-mail du foyer. Même contrat que
     pastillesFoyer et grillePrenoms : chaîne vide quand le bloc n'a
     pas lieu d'être. Un foyer qui ne vient pas ne voit jamais ces
     champs, et le backend efface ceux d'un foyer qui se rétracte. */
  function coordonnees(visible){
    if (!visible) return "";
    return '<div class="coord">'
      +  '<p class="coord-titre">' + echap(T.coord_titre) + '</p>'
      +  '<div class="champ champ-court">'
      +  '<label for="adresse">' + echap(T.adresse_label) + '</label>'
      +  '<textarea id="adresse" rows="2" autocomplete="street-address" '
      +  'placeholder="' + echap(T.adresse_ex) + '">'
      +  echap(etat.adresse) + '</textarea></div>'
      +  '<div class="champ">'
      +  '<label for="email">' + echap(T.email_label) + '</label>'
      +  '<input type="email" id="email" inputmode="email" '
      +  'autocomplete="email" autocapitalize="off" spellcheck="false" '
      +  'placeholder="' + echap(T.email_ex) + '" '
      +  'value="' + echap(etat.email) + '"></div>'
      +  '</div>';
  }

  /* Les prénoms à cocher, posés dans la liste des réponses sous les
     pastilles. Même contrat que pastillesFoyer : on rend une chaîne
     vide quand le bloc n'a pas lieu d'être, l'appelant n'a donc pas
     de condition à écrire. */
  function grillePrenoms(visible){
    if (!visible) return "";
    return '<div class="membres">'
      +  '<p>' + echap(T.qui) + '</p>'
      +  '<div class="membres-grille">'
      +  invites.map(function(i){
           var coche = etat.presents.indexOf(i.prenom) >= 0;
           return '<div class="membre"><label>'
             + '<input type="checkbox" data-prenom="' + echap(i.prenom) + '"'
             + (coche ? " checked" : "") + '>'
             + '<span>' + echap(i.prenom) + '</span></label></div>';
         }).join("")
      +  '</div></div>';
  }

  function brancherChoix(){
    tiroir.querySelectorAll('input[name="rep"]').forEach(function(r){
      r.addEventListener("change", function(){
        var v = r.value;
        etat.reponse = (v === "oui") ? "tous" : v;
        if (etat.reponse === "tous")  etat.presents = prenoms.slice();
        if (etat.reponse === "aucun") etat.presents = [];
        memoriserChamps();
        dessinerChoix();
      });
    });

    tiroir.querySelectorAll('input[name="venue"]').forEach(function(r){
      r.addEventListener("change", function(){ etat.brunch = (r.value === "brunch"); });
    });

    tiroir.querySelectorAll('.membres-grille input[type="checkbox"]')
      .forEach(function(c){
        c.addEventListener("change", function(){
          var nom = c.getAttribute("data-prenom");
          var i = etat.presents.indexOf(nom);
          if (c.checked && i < 0) etat.presents.push(nom);
          if (!c.checked && i >= 0) etat.presents.splice(i, 1);
        });
      });

    tiroir.querySelector("#ann").addEventListener("click", fermerTiroir);
    tiroir.querySelector("#env").addEventListener("click", soumettre);
  }

  /* Le panneau est redessiné à chaque changement de réponse : sans
     cette sauvegarde, tout ce qui a été tapé disparaîtrait au
     moindre aller-retour entre deux options. */
  function memoriserChamps(){
    var z = tiroir.querySelector("#mot");
    if (z) etat.mot = z.value;
    var a = tiroir.querySelector("#adresse");
    if (a) etat.adresse = a.value;
    var e = tiroir.querySelector("#email");
    if (e) etat.email = e.value;
  }

  /* ═══════════════════════════════════════════════════════════════
     5. ENVOI
     ═══════════════════════════════════════════════════════════════ */

  function soumettre(){
    memoriserChamps();
    var err = tiroir.querySelector("#err-rsvp");

    if (!etat.reponse){ err.textContent = T.err_personne; return; }
    if (etat.reponse !== "aucun" && !etat.presents.length){
      err.textContent = T.err_personne; return;
    }

    /* Le foyer vient : on a besoin de savoir où lui écrire. Le
       backend refait ces deux contrôles de son côté, l'URL /exec
       étant publique. */
    if (etat.reponse !== "aucun"){
      if (!etat.adresse.trim()){
        err.textContent = T.err_adresse;
        focaliser("#adresse"); return;
      }
      if (!EMAIL.test(etat.email.trim())){
        err.textContent = T.err_email;
        focaliser("#email"); return;
      }
    }

    var bouton = tiroir.querySelector("#env");
    bouton.disabled = true;
    bouton.textContent = T.envoi_cours;
    err.textContent = "";

    envoyer({
      action: "repondre",
      code: code,
      presents: (etat.reponse === "aucun") ? [] : etat.presents,
      brunch: (etat.reponse !== "aucun") && etat.brunch,
      mot: etat.mot,
      adresse: (etat.reponse === "aucun") ? "" : etat.adresse.trim(),
      email:   (etat.reponse === "aucun") ? "" : etat.email.trim()
    })
    .then(function(d){
      if (!d || !d.ok) throw new Error(d && d.erreur);
      foyer.reponse = { presents:etat.presents, brunch:etat.brunch,
                        mot:etat.mot, adresse:etat.adresse, email:etat.email };
      sessionStorage.setItem("foyer", JSON.stringify(foyer));
      majBouton();
      confirmer(etat.reponse !== "aucun");
    })
    .catch(function(){
      bouton.disabled = false;
      bouton.textContent = seul ? T.envoyer_solo : T.envoyer;
      err.textContent = T.err_envoi;
    });
  }

  /* Deux états seulement : on vient, ou on ne vient pas. */
  function confirmer(positif){
    tiroir.innerHTML = positif
      ? '<div class="merci">'
        + '<div class="coche">✓</div>'
        + '<h2>' + echap(T.merci_oui) + '</h2>'
        + '<p>' + echap(T.merci_oui_2) + '</p>'
        + '<button class="btn btn-fantome" id="fer">' + echap(T.fermer) + '</button>'
        + '</div>'
      : '<div class="merci">'
        + '<div class="coche">✓</div>'
        + '<h2>' + echap(T.merci_non) + '</h2>'
        + '<div class="recap">' + echap(T.merci_non_2)
        + ' <span class="emoji">🥺</span></div>'
        + '<button class="btn btn-fantome" id="fer">' + echap(T.fermer) + '</button>'
        + '</div>';
    tiroir.querySelector("#fer").addEventListener("click", fermerTiroir);
  }

  voile.addEventListener("click", function(e){
    if (e.target === voile) fermerTiroir();
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !voile.hidden) fermerTiroir();
  });
})();
</script>

</body>
</html>
