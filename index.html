<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sophie &amp; Edi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cinzel:wght@400;500;700&family=Playfair+Display:wght@400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- La page suivante et la photo se téléchargent pendant que
     l'invité tape son code : la bascule paraît instantanée. -->
<link rel="prefetch" href="invitation.html">
<link rel="prefetch" href="photo.jpg">
</head>
<body>

<div class="page-code">
  <h1 class="monogramme">Sophie<span class="et">&amp;</span>Edi</h1>
  <p class="sous-titre"><span id="save">Save the date</span></p>

  <p class="invite-code" id="invite"></p>

  <div class="saisie" id="saisie">
    <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="1">
    <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="2">
    <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="3">
    <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="4">
  </div>

  <p class="erreur" id="erreur" role="status"></p>
</div>

<script src="config.js"></script>
<script>
(function(){
  "use strict";

  /* ?lang=en force la langue pour vérifier une page ; sinon défaut.
     La vraie langue du foyer arrive avec le code, page suivante. */
  var p = new URLSearchParams(location.search);
  var lang = (p.get("lang") === "en" || p.get("lang") === "fr")
               ? p.get("lang") : LANGUE_DEFAUT;
  var T = TEXTES[lang] || TEXTES.fr;

  document.documentElement.lang = lang;
  document.title            = T.titre_page;
  document.getElementById("save").textContent   = T.save;
  document.getElementById("invite").textContent = T.code_invite;

  var cases  = [].slice.call(document.querySelectorAll("#saisie input"));
  var erreur = document.getElementById("erreur");
  var occupe = false;

  cases.forEach(function(c, i){
    c.addEventListener("input", function(){
      c.value = c.value.replace(/\D/g, "").slice(0, 1);
      erreur.textContent = "";
      if (c.value && i < 3) cases[i + 1].focus();
      if (cases.every(function(x){ return x.value; })) valider();
    });

    /* Retour arrière sur une case vide : on remonte d'un cran. */
    c.addEventListener("keydown", function(e){
      if (e.key === "Backspace" && !c.value && i > 0){
        cases[i - 1].focus();
        cases[i - 1].value = "";
        e.preventDefault();
      }
    });

    /* Coller un code entier d'un coup. */
    c.addEventListener("paste", function(e){
      var t = (e.clipboardData || window.clipboardData).getData("text");
      var d = String(t).replace(/\D/g, "").slice(0, 4);
      if (!d) return;
      e.preventDefault();
      cases.forEach(function(x, j){ x.value = d[j] || ""; });
      if (d.length === 4) valider();
      else cases[d.length].focus();
    });
  });

  cases[0].focus();

  /* Apps Script s'endort entre deux visites : le premier appel paie
     un démarrage à froid de une à trois secondes. Un ping muet dès
     l'arrivée réveille le service pendant que l'invité tape, et la
     validation du code part sur un service déjà chaud. */
  try {
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"ping" })
    }).catch(function(){});
  } catch (e){}

  /* ── un appel qui insiste (v20) ──
     Apps Script ne répond jamais directement : /exec redirige vers
     script.googleusercontent.com, et c'est cette seconde adresse, à
     jeton court, qui renvoie par moments un 404. Le script, lui,
     s'est exécuté jusqu'au bout — le journal en porte la trace et
     le panneau Exécutions ne signale aucun échec. Seule la réponse
     s'est perdue en route.

     L'incident est passager et sans motif : on réessaie, plutôt que
     d'annoncer à l'invité une panne de connexion qui n'existe pas.
     Trois tentatives, espacées de 600 puis 1500 ms.

     Rejouer un appel est sans risque ici : ouvrir ne fait que lire,
     et repondre efface les lignes du foyer avant de les réécrire,
     donc une tentative en double ne peut pas créer de doublon.

     Un vrai code faux n'est PAS concerné : le backend répond
     correctement { ok:false }, ce qui n'est pas une erreur réseau.
     Le message « ce code ne correspond à aucune invitation »
     s'affiche donc toujours du premier coup. */
  function appelAPI(charge, reste){
    if (reste === undefined) reste = 2;
    return fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(charge)
    })
    .then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .catch(function(err){
      if (!reste) throw err;
      return new Promise(function(suite){
        setTimeout(suite, reste === 2 ? 600 : 1500);
      }).then(function(){ return appelAPI(charge, reste - 1); });
    });
  }

  function valider(){
    if (occupe) return;
    var code = cases.map(function(c){ return c.value; }).join("");
    if (!/^\d{4}$/.test(code)) return;

    occupe = true;
    erreur.textContent = "";
    cases.forEach(function(c){ c.disabled = true; });

    appelAPI({ action:"ouvrir", code:code })
    .then(function(d){
      if (d && d.ok){
        /* sessionStorage : le code est redemandé à chaque nouvel
           onglet, mais pas à chaque aller-retour dans la soirée. */
        sessionStorage.setItem("foyer", JSON.stringify(d));
        sessionStorage.setItem("code", code);
        location.href = "invitation.html";
      } else {
        echec(T.code_erreur);
      }
    })
    .catch(function(){ echec(T.code_reseau); });
  }

  function echec(message){
    occupe = false;
    erreur.textContent = message;
    cases.forEach(function(c){ c.disabled = false; c.value = ""; });
    cases[0].focus();
    /* Pas de ping ici : le service est déjà réveillé depuis
       l'arrivée sur la page, et un appel de plus à chaque code
       refusé ne faisait qu'encombrer. */
  }
})();
</script>

</body>
</html>
